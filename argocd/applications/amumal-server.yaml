apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: amumal-server
  namespace: argocd
spec:
  project: default

  source:
    # 백엔드 Helm chart는 이 저장소의 chart 디렉토리에 정의
    repoURL: https://github.com/pattie-assignments/k8s-pilot.git
    targetRevision: main
    path: chart

  destination:
    server: https://kubernetes.default.svc
    namespace: backend

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
