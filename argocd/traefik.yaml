# Argo CD가 어떤 Traefik Helm chart를 어떤 values로 배포할지 선언하는 Application 리소스
# Deployment, Service, IngressClass 같은 실제 템플릿은 Traefik chart 안에 존재, 이 파일은 chart와 values 파일을 연결
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  # Argo CD 화면에 표시되는 Application 이름
  name: traefik

  # Application 리소스가 생성되는 네임스페이스
  namespace: argocd

spec:
  project: default

  sources:
    # 실제 Deployment, Service 등의 템플릿이 있는
    # Traefik 공식 Helm Chart
    - repoURL: https://traefik.github.io/charts
      chart: traefik
      targetRevision: "40.2.0"
      helm:
        releaseName: traefik

        # 두 번째 소스의 Git 저장소 루트를 기준으로
        # 사용자 values 파일을 가져옴
        valueFiles:
          - $values/argocd/values/traefik-values.yaml

    # 두 번째 소스: 사용자 values 파일이 저장된 Git 저장소
    - repoURL: https://github.com/pattie-assignments/k8s-pilot.git
      targetRevision: main

      # 첫 번째 소스에서 $values로 참조할 수 있게 별칭 지정
      ref: values

  destination:
    # 현재 Argo CD가 설치된 Kubernetes 클러스터에 배포
    server: https://kubernetes.default.svc

    # Traefik Pod, Service, IngressClass가 생성될 네임스페이스
    namespace: traefik

  syncPolicy:
    automated:
      # Git 선언에서 사라진 리소스를 클러스터에서도 삭제
      prune: true

      # 클러스터에서 수동 변경하면 Git 선언 상태로 복원
      selfHeal: true

    syncOptions:
      # traefik 네임스페이스가 없으면 자동 생성
      - CreateNamespace=true
