replicas: 1

deploymentStrategy:
  # Grafana는 기본 메타데이터 DB로 내장 sqlite를 사용, sqlite는 파일 하나를 잠그면서 사용하는 DB
  # 따라서 업데이트 시 두 노드에서 쓰기 마운트 하지 않도록 기존 Pod를 모두 종료 후 생성하도록 지정
  type: Recreate

service:
  type: ClusterIP
  port: 80

persistence:
  enabled: true
  type: pvc
  storageClassName: local-path
  accessModes:
    - ReadWriteOnce # 하나의 노드에서만 쓰기 마운트할 수 있다
  size: 1Gi

nodeSelector:
  monitoring: "yes"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: true # grafana용 ingress 생성
  ingressClassName: traefik
  hosts:
    - grafana.pattie.cloud
  path: /
  pathType: Prefix

grafana.ini:
  server:
    domain: grafana.pattie.cloud # 접속 URL
    root_url: https://grafana.pattie.cloud/ # 외부에 노출되는 기준을 HTTPS로 고정

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
      - name: Loki
        type: loki
        access: proxy
        # gateway를 꺼서 Loki 서비스에 직접 붙으므로, 기본 HTTP 80이 아니라 Loki API 포트 3100을 명시
        url: http://loki.monitoring.svc.cluster.local:3100

# Secret값 사용
admin:
  existingSecret: grafana-admin-secret
  userKey: admin-user
  passwordKey: admin-password
