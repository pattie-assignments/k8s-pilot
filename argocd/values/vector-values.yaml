# 노드마다 Vector Pod 1개를 실행하는 DaemonSet 모드
role: Agent

# Vector 자체 로그를 다시 수집하지 않도록 지정 (기본값)
podLabels:
  vector.dev/exclude: "true"

# Control Plane 노드 로그도 수집
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Vector가 노드의 로그 파일을 직접 읽어 Loki로 전송하므로,
# 다른 Pod가 Vector에 로그를 전송하기 위한 Service는 생성하지 않음
service:
  enabled: false

serviceHeadless:
  enabled: false

persistence:
  hostPath: # 로그 파일을 어디까지 읽었는지 체크포인트를 보존
    enabled: true
    path: /var/lib/vector

# customConfig 사용 시 API를 직접 활성화해야 Probe 사용 가능
livenessProbe:
  grpc:
    port: 8686

readinessProbe:
  grpc:
    port: 8686

# Vector 프로그램의 파이프라인 설정
customConfig:
  data_dir: /vector-data-dir # 로그 파일을 어디까지 읽었는지 체크포인트, loki 전송 대기 로그 저장

  api:
    enabled: true
    address: 0.0.0.0:8686
    playground: false

  sources:
    # 현재 노드의 Kubernetes Pod 로그 수집
    kubernetes_logs:
      type: kubernetes_logs

  transforms:
    # 저장소와 무관한 공통 로그 필드 생성
    normalize_logs:
      type: remap
      inputs:
        - kubernetes_logs
      source: |
        .cluster = "k8s-pilot"
        .namespace = .kubernetes.pod_namespace
        .pod = .kubernetes.pod_name
        .container = .kubernetes.container_name
        .node = .kubernetes.pod_node_name

        if exists(.kubernetes.pod_labels."app.kubernetes.io/name") {
          .service = .kubernetes.pod_labels."app.kubernetes.io/name"
        } else if exists(.kubernetes.pod_labels.app) {
          .service = .kubernetes.pod_labels.app
        } else {
          .service = .kubernetes.container_name
        }

  # 최종 전송 목적지 - loki로 전달
  sinks:
    loki: # 임의로 정한 sink 이름
      type: loki # Loki Push API 규격으로 변환해서 HTTP 요청으로 전송
      inputs:
        - normalize_logs # 정규화가 완료된 로그를 입력받음

      endpoint: http://loki.monitoring.svc.cluster.local:3100

      encoding:
        codec: json

      remove_timestamp: false #json 본문의 timestamp 필드 유지 (인덱싱용 timestamp와 별개)
      out_of_order_action: accept # 조금 늦게 도착해도 조작/삭제 없이 loki에 전송 (기본값)

      # Loki 라벨로 포함할 필드를 지정하는 목록
      labels:
        cluster: |-
          {{ print "{{ cluster }}" }}
        namespace: |-
          {{ print "{{ namespace }}" }}
        service: |-
          {{ print "{{ service }}" }}
        container: |-
          {{ print "{{ container }}" }}
        node: |-
          {{ print "{{ node }}" }}

      # Loki가 잠시 느리거나 통신이 끊겼을 때 로그를 disk에 임시 저장
      buffer:
        type: disk
        # 노드 당 512 MiB (임의값), 추후 Vector의 buffer_size_bytes 지표를 보고 수정
        max_size: 536870912
        when_full: block