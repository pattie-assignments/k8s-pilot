apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.configMap.name }}
  labels:
    name: {{ .Values.labels.name }}
    tier: {{ .Values.labels.tier }}
    env: {{ .Values.labels.env }}
    part-of: {{ .Values.labels.partOf }}

data:
  {{- range $key, $value := .Values.configMap.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}