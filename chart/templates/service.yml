apiVersion: v1
kind: Service

metadata:
  name: amumal-backend-service
  labels:
    name: "{{ .Values.labels.name }}"
    tier: "{{ .Values.labels.tier }}"
    env: "{{ .Values.labels.env }}"
    part-of: "{{ .Values.labels.partOf }}"

spec:
  type: "{{ .Values.service.type }}"

  selector:
    name: "{{ .Values.labels.name }}"
    tier: "{{ .Values.labels.tier }}"
    env: "{{ .Values.labels.env }}"
    part-of: "{{ .Values.labels.partOf }}"

  ports:
    - protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http