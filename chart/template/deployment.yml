apiVersion: apps/v1
kind: Deployment

metadata:
  name: amumal-backend-deployment
  labels:
    name: "{{ .Values.labels.name }}"
    tier: "{{ .Values.labels.tier }}"
    env: "{{ .Values.labels.env }}"
    part-of: "{{ .Values.labels.partOf }}"

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      name: "{{ .Values.labels.name }}"
      env: "{{ .Values.labels.env }}"

  template:
    metadata:
      labels:
        name: "{{ .Values.labels.name }}"
        tier: "{{ .Values.labels.tier }}"
        env: "{{ .Values.labels.env }}"
        part-of: "{{ .Values.labels.partOf }}"

    spec:
      imagePullSecrets:
        - name: "{{ .Values.existingSecrets.imagePullSecret }}"

      containers:
        - name: amumal-backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: "{{ .Values.image.pullPolicy }}"

          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: amumal-db-config
                  key: SPRING_DATASOURCE_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.existingSecrets.databaseSecret }}"
                  key: SPRING_DATASOURCE_USERNAME

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.existingSecrets.databaseSecret }}"
                  key: SPRING_DATASOURCE_PASSWORD

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          startupProbe:
            httpGet:
              path: /v1/actuator/health
              port: http
            initialDelaySeconds: 14
            failureThreshold: 18
            periodSeconds: 3

          readinessProbe:
            httpGet:
              path: /v1/actuator/health/readiness
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 5

          livenessProbe:
            httpGet:
              path: /v1/actuator/health/liveness
              port: http
            initialDelaySeconds: 0
            periodSeconds: 10
            failureThreshold: 5