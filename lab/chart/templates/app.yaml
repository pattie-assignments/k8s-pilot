apiVersion: v1
kind: ConfigMap
metadata:
  name: community-service
data:
  SPRING_PROFILES_ACTIVE: pilot
  DB_HOST: {{ .Values.mysql.host | quote }}
  DB_PORT: {{ .Values.mysql.port | quote }}
  DB_NAME: {{ .Values.mysql.database | quote }}
  DB_USERNAME: {{ .Values.mysql.username | quote }}
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  REDIS_SSL_ENABLED: "false"
  SEARCH_ENGINE: mysql
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=65"
  LOGGING_LEVEL_ORG_HIBERNATE_SQL: INFO
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: community-service-uploads-rwx
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteMany]
  storageClassName: ""
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: {{ .Release.Namespace }}
    name: community-service-uploads-rwx
  mountOptions: [nfsvers=4.1]
  nfs:
    server: {{ required "storage.nfsServer must be the control plane private IP" .Values.storage.nfsServer | quote }}
    path: {{ .Values.storage.path | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: community-service-uploads-rwx
spec:
  volumeName: community-service-uploads-rwx
  storageClassName: ""
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: community-service
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: { app: community-service }
  template:
    metadata:
      labels: { app: community-service }
      annotations:
        checksum/config: {{ list .Values.mysql .Values.redis | toJson | sha256sum }}
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      nodeSelector: { k8s-pilot/worker: "true" }
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app: community-service }
      tolerations:
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 45 }
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 45 }
      securityContext:
        fsGroup: 1000
      containers:
        - name: community-service
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef: { name: community-service }
          env:
            {{- range $key := list "DB_PASSWORD" "REDIS_PASSWORD" "JWT_SECRET" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef: { name: {{ $.Values.existingSecret | quote }}, key: {{ $key }} }
            {{- end }}
          resources:
            requests: { cpu: 150m, memory: 512Mi }
            limits: { memory: 1200Mi }
          startupProbe:
            httpGet: { path: /v1/actuator/health/readiness, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /v1/actuator/health/readiness, port: http }
            periodSeconds: 10
            timeoutSeconds: 4
          livenessProbe:
            httpGet: { path: /v1/actuator/health/liveness, port: http }
            periodSeconds: 15
            timeoutSeconds: 4
            failureThreshold: 5
          volumeMounts:
            - { name: uploads, mountPath: /app/uploads }
      volumes:
        - name: uploads
          persistentVolumeClaim: { claimName: community-service-uploads-rwx }
---
apiVersion: v1
kind: Service
metadata:
  name: community-service
spec:
  selector: { app: community-service }
  ports:
    - { port: 80, targetPort: http }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: community-service
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: community-service
                port: { number: 80 }
